services:
  wb2api:
    build: .
    container_name: workbuddy2api-pro
    restart: unless-stopped
    # 优雅停机上限（v2.2.0 #14/#17）：比应用 server.shutdown_timeout（默认 30s）多留 5s，
    # 保证「取消调度器 → 排空在途请求 → 落盘」跑完才被 SIGKILL。
    stop_grace_period: 35s
    # 日志轮转（v2.2.0 #17）：1146 号一次签到就是上千行 stdout，json-file 默认无限增长
    # 会把宿主机磁盘写满。20MiB × 3 份 = 单容器最多约 60MiB。
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
    # 容器默认以 app 用户（uid 10001）运行。宿主机挂载目录属主不同会导致
    # 「写入 auths/*.json.tmp 失败 permission denied」，三种解法任选：
    #   1) 非 root · 让容器以你自己的 uid 运行（挂载目录本来就是你建的）：
    #      PUID=$(id -u) PGID=$(id -g) docker compose up -d
    #      或写进 .env 文件：PUID=1000 / PGID=1000
    #   2) sudo chown -R 10001:10001 ./auths ./data ./config.json
    #   3) user: "0:0" 以 root 运行（省事但容器逃逸面更大，自担）
    user: "${PUID:-10001}:${PGID:-10001}"
    environment:
      - TZ=Asia/Shanghai
      # v2.4.0 #7 凭证静态加密：仅当 config.json 的 security.encrypt_auths=true 时
      # 必填（缺失/非法会启动失败）。值为 32 字节主密钥的 base64 或 64 位 hex，例如
      # `openssl rand -base64 32` 的输出。请单独备份主密钥、不要与 auths/ 放一起：
      # 丢失后已加密的凭证不可恢复。启用前先停服执行 authcrypt -encrypt 迁移。
      # - WB2A_MASTER_KEY: "<base64-32B>"
    ports:
      - "7863:7863"
    volumes:
      - ./auths:/app/auths
      - ./data:/app/data
      # 注意：宿主机必须先有 config.json（cp config.example.json config.json）。
      # 缺失时 Docker 会把挂载点创建成目录 → 容器启动失败（程序会自动生成配置，
      # 但前提是它能以文件形式写入 —— 挂载目录会挡住这条路径）。
      # 不挂 :ro：面板「配置」页需要写回此文件（保存后热生效）。
      - ./config.json:/app/config.json
